/* =========================================================================
   상태값 & 로직
========================================================================= */
let state = {
  mode: null,
  index: 0,
  scores: { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 },
  resultType: null,
};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goToMain() {
  showScreen('screen-main');
}

function startTest(modeKey) {
  state.mode = modeKey;
  state.index = 0;
  state.scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
  showScreen('screen-question');
  renderQuestion();
}

function renderQuestion() {
  const test = TEST_DATA[state.mode];
  const q = test.questions[state.index];

  document.getElementById('question-emoji').textContent = test.emoji;
  document.getElementById('question-text').textContent = q.q;
  document.getElementById('option-a').textContent = 'A. ' + q.a.text;
  document.getElementById('option-b').textContent = 'B. ' + q.b.text;

  const pct = Math.round((state.index / test.questions.length) * 100);
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = state.index + '/' + test.questions.length;
}

function selectAnswer(choiceIdx) {
  const test = TEST_DATA[state.mode];
  const q = test.questions[state.index];
  const chosen = choiceIdx === 0 ? q.a : q.b;
  state.scores[chosen.type]++;

  state.index++;

  if (state.index >= test.questions.length) {
    document.getElementById('progress-bar').style.width = '100%';
    document.getElementById('progress-text').textContent = test.questions.length + '/' + test.questions.length;
    setTimeout(() => runLoadingThenResult(), 200);
  } else {
    renderQuestion();
  }
}

function runLoadingThenResult() {
  showScreen('screen-loading');

  const messages = [
    '연애 세포 분석 중...',
    '마음속 데이터 수집 중...',
    '결과지 작성 중...'
  ];
  let mIdx = 0;
  const loadingTextEl = document.getElementById('loading-text');
  const msgInterval = setInterval(() => {
    mIdx = (mIdx + 1) % messages.length;
    loadingTextEl.textContent = messages[mIdx];
  }, 1000);

  setTimeout(() => {
    clearInterval(msgInterval);
    computeResultAndRender();
    showScreen('screen-result');
  }, 3000);
}

function computeResultAndRender() {
  const s = state.scores;
  const type =
    (s.E >= s.I ? 'E' : 'I') +
    (s.S >= s.N ? 'S' : 'N') +
    (s.T >= s.F ? 'T' : 'F') +
    (s.J >= s.P ? 'J' : 'P');

  state.resultType = type;

  const test = TEST_DATA[state.mode];
  const result = test.results[type];

  document.getElementById('result-emoji').textContent = result.emoji;
  document.getElementById('result-mbti').textContent = test.name + ' · ' + type;
  document.getElementById('result-title').textContent = result.emoji + ' ' + result.title;
  document.getElementById('result-line1').textContent = result.lines[0];
  document.getElementById('result-line2').textContent = result.lines[1];
  document.getElementById('result-line3').textContent = result.lines[2];
}

/* =========================================================================
   공유 기능
========================================================================= */
function shareKakao() {
  // 실제 배포 시: 카카오 디벨로퍼스에서 발급받은 JavaScript 키로 Kakao SDK를 로드하고
  // Kakao.Share.sendDefault({...}) 형태로 교체하세요.
  if (navigator.share) {
    navigator.share({
      title: '연애 MBTI 테스트',
      text: '나의 연애 유형을 확인해보세요!',
      url: window.location.href
    }).catch(() => {});
  } else {
    showToast('카카오톡 공유 기능은 카카오 SDK 연동 후 활성화됩니다 💬');
  }
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    showToast('링크가 복사되었습니다 🔗');
  }).catch(() => {
    showToast('복사에 실패했어요. 다시 시도해주세요.');
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.opacity = '1';
  setTimeout(() => { toast.style.opacity = '0'; }, 2200);
}
</script>
